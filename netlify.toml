# Configuración de Netlify para meltrujillo.com
# Sitio estático: portada (index.html), blog, recursos y páginas sueltas en la raíz.
# Las funciones del servidor viven en netlify/functions (capi.js, cal-webhook.js, uptime-check.js y cronogramas-api.mjs).

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Vigilante de caídas: revisa la landing cada 10 minutos y avisa al celular y al correo.
[functions."uptime-check"]
  schedule = "*/10 * * * *"

# ---------- Direcciones alternativas ----------
# /privacy lleva a la política de privacidad (la página real se llama privacidad.html).
[[redirects]]
  from = "/privacy"
  to = "/privacidad"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacidad"
  status = 301

# ---------- Seguridad básica y velocidad ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Los archivos compartidos (CSS y JS) se revalidan en cada visita, así un cambio de color o de tracking
# llega a todas las páginas sin que nadie tenga que limpiar la memoria del navegador.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- Cronogramas 1:1 de las parejas ----------
# Cada pareja tiene su enlace privado /c/<pareja>-<código>; todas usan la misma plantilla.
# Lo que ellos llenan se guarda en Netlify Blobs a través de /api/cronogramas (función cronogramas-api.mjs).
# Crear una pareja nueva no necesita publicar el sitio otra vez. Mel administra todo desde /cronogramas/ con su clave.
[[redirects]]
  from = "/c/*"
  to = "/cronogramas/cronograma.html"
  status = 200
  force = true

[[headers]]
  for = "/c/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/cronogramas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/cronogramas/*"
  [headers.values]
    Cache-Control = "no-store"
